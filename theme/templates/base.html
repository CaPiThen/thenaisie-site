<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ SITENAME }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ SITESUBTITLE }}{% endblock %}">
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/style.css">
</head>
<body>

<nav class="nav">
  <a href="{{ SITEURL }}/" class="nav-logo">{{ SITENAME }}</a>
  <ul class="nav-links">
    {% for name, url in MENUITEMS %}
    <li><a href="{{ url }}" {% if request and request.path == url %}class="active"{% endif %}>{{ name }}</a></li>
    {% endfor %}
  </ul>
  <div class="nav-hamburger" onclick="this.classList.toggle('open')">
    <span></span><span></span><span></span>
  </div>
</nav>

{% block content %}{% endblock %}

<footer class="footer">
  <div class="footer-logo">{{ SITENAME }}</div>
  <div class="footer-copy">© {% now 'Y' %} Pierre Thenaisie — La vie est belle.</div>
</footer>

</body>
</html>
