name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v7

      - name: Installation de Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Installation de Pelican
        run: pip install pelican markdown

      - name: Galerie Immich (récupération au moment du build)
        env:
          IMMICH_SHARE_URL: ${{ vars.IMMICH_SHARE_URL }}
        run: python build_gallery.py

      - name: Génération du site
        run: pelican content -s pelicanconf.py

      - name: Configuration de Pages
        uses: actions/configure-pages@v6

      - name: Empaquetage de l'artefact
        uses: actions/upload-pages-artifact@v5
        with:
          path: output/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
