<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ SITENAME }}{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}{{ SITESUBTITLE }}{% endblock %}">
  <link rel="canonical" href="{% block og_url %}{{ SITE_ABSOLUTE_URL }}/{% endblock %}">
  <meta name="theme-color" content="#0a0d08">

  <link rel="icon" type="image/svg+xml" href="{{ SITEURL }}/theme/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ SITEURL }}/theme/images/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ SITEURL }}/theme/images/favicon-16.png">
  <link rel="apple-touch-icon" href="{{ SITEURL }}/theme/images/apple-touch-icon.png">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ SITENAME }}">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:title" content="{{ self.title() }}">
  <meta property="og:description" content="{{ self.meta_description() }}">
  <meta property="og:url" content="{{ self.og_url() }}">
  <meta property="og:image" content="{{ SITE_ABSOLUTE_URL }}/theme/images/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ self.title() }}">
  <meta name="twitter:description" content="{{ self.meta_description() }}">
  <meta name="twitter:image" content="{{ SITE_ABSOLUTE_URL }}/theme/images/og-image.png">

  <link rel="preload" href="{{ SITEURL }}/theme/fonts/petrona-normal-100-900-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ SITEURL }}/theme/fonts/karla-normal-400-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/fonts.css?v={{ ASSET_VERSION }}">
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/style.css?v={{ ASSET_VERSION }}">
  <script src="{{ SITEURL }}/theme/js/ethereal.js?v={{ ASSET_VERSION }}" defer></script>
  <script src="{{ SITEURL }}/theme/js/animations.js?v={{ ASSET_VERSION }}" defer></script>
</head>
<body class="{% block bodyclass %}{% endblock %}">

<header class="nav">
  <a class="nav-logo" href="{{ SITEURL }}/">~/ thenaisiepierre</a>
  <span class="nav-status"><span class="nav-dot" aria-hidden="true"></span>labo personnel</span>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <span class="footer-ghost" aria-hidden="true">thenaisie</span>
  <div class="footer-inner">
    <a class="footer-logo" href="mailto:contact@thenaisiepierre.fr">Pierre Thenaisie</a>
    <span class="footer-sub">© 2026 — écrit &amp; cultivé à la main</span>
  </div>
</footer>

<script>
(function () {
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* --- Largeur de la barre de défilement ---
     Les bandes pleine largeur utilisent 100vw, qui inclut la barre de
     défilement : sans correction, la page défile horizontalement. */
  var setScrollbarWidth = function () {
    var w = window.innerWidth - document.documentElement.clientWidth;
    document.documentElement.style.setProperty('--sbw', (w > 0 ? w : 0) + 'px');
  };
  setScrollbarWidth();
  var sbTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(sbTimer);
    sbTimer = setTimeout(setScrollbarWidth, 150);
  });

  /* --- Révélation au défilement ---
     Le sommaire de l'accueil (.index-row) reste volontairement hors de
     cette liste : Pierre veut un défilement lisse, sans rien qui
     « apparaisse » — voir BDR-014. Son geste au scroll à lui est le
     hero qui se dissout, en CSS pur (voir style.css, BDR-030). */
  var els = document.querySelectorAll('.cv-entry, .article-card, .callout, .skills-group, .photo-item, .prose, .lead');
  els.forEach(function (el) { el.classList.add('reveal'); });
  if (!('IntersectionObserver' in window) || reduced) {
    els.forEach(function (el) { el.classList.add('in'); });
  } else {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -4% 0px' });
    els.forEach(function (el) { io.observe(el); });
  }
})();
</script>
</body>
</html>
