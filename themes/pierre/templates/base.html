<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ SITENAME }}{% endblock %}</title>
  <meta name="description" content="{{ SITESUBTITLE }}">
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

<nav class="nav">
  <a href="{{ SITEURL }}/" class="nav-logo">{{ SITENAME }}</a>
  <button class="nav-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')">☰</button>
  <div class="nav-links">
    {% for title, url in MENUITEMS %}
    <a href="{{ SITEURL }}{{ url }}">{{ title }}</a>
    {% endfor %}
  </div>
</nav>

<main>
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <span class="footer-logo">{{ SITENAME }}</span>
  <span class="footer-sub">© {{ SITENAME }} — Tous droits réservés</span>
</footer>

<script>
  // Fermer le menu mobile au clic sur un lien
  document.querySelectorAll('.nav-links a').forEach(a => {
    a.addEventListener('click', () => document.querySelector('.nav-links').classList.remove('open'));
  });
</script>
</body>
</html>
