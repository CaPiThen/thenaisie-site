<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ SITENAME }}{% endblock %}</title>
  <meta name="description" content="{{ SITESUBTITLE }}">
  <meta name="theme-color" content="#0a0d08">
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="{{ SITEURL }}/theme/js/vendor/gsap.min.js" defer></script>
  <script src="{{ SITEURL }}/theme/js/ethereal.js" defer></script>
  <script src="{{ SITEURL }}/theme/js/vendor/anime.min.js" defer></script>
  <script src="{{ SITEURL }}/theme/js/animations.js" defer></script>
</head>
<body class="{% block bodyclass %}{% endblock %}">

<!-- Formes réutilisées par les décors botaniques (une seule définition pour tout le site) -->
<svg class="svg-sprite" aria-hidden="true" focusable="false">
  <defs>
    <path id="folio" d="M0 0C14-9 40-11 60 0C40 11 14 9 0 0Z"/>
    <path id="folio-fin" d="M0 0C10-5 30-6 46 0C30 6 10 5 0 0Z"/>
  </defs>
</svg>

<header class="nav">
  <span class="nav-logo">~/ thenaisiepierre</span>
  <span class="nav-status"><span class="nav-dot" aria-hidden="true"></span>labo personnel</span>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer class="footer">
  <span class="footer-ghost" aria-hidden="true">thenaisie</span>
  <div class="footer-inner">
    <span class="footer-logo">Pierre Thenaisie</span>
    <span class="footer-sub">© 2026 — écrit &amp; cultivé à la main</span>
  </div>
</footer>

<script>
(function () {
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* --- Largeur de la barre de défilement ---
     Les bandes pleine largeur utilisent 100vw, qui inclut la barre de
     défilement : sans correction, la page défile horizontalement. */
  var setScrollbarWidth = function () {
    var w = window.innerWidth - document.documentElement.clientWidth;
    document.documentElement.style.setProperty('--sbw', (w > 0 ? w : 0) + 'px');
  };
  setScrollbarWidth();
  var sbTimer = 0;
  window.addEventListener('resize', function () {
    clearTimeout(sbTimer);
    sbTimer = setTimeout(setScrollbarWidth, 150);
  });

  /* --- Révélation au défilement ---
     .hub-card exclu volontairement : Pierre veut un défilement lisse sur
     l'accueil, sans aucune section/carte qui « apparaisse » — les cartes
     du sommaire restent donc toujours pleinement visibles. */
  var els = document.querySelectorAll('.project-card, .cv-entry, .article-card, .callout, .skills-group, .photo-item, .prose, .lead');
  els.forEach(function (el) { el.classList.add('reveal'); });
  if (!('IntersectionObserver' in window) || reduced) {
    els.forEach(function (el) { el.classList.add('in'); });
  } else {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, { threshold: 0.08, rootMargin: '0px 0px -4% 0px' });
    els.forEach(function (el) { io.observe(el); });
  }

  /* Jamais d'effet au curseur en mouvement réduit. On ne teste PAS « pointer: fine »
     au chargement : sur un appareil hybride la souris peut arriver après. On filtre
     plutôt sur le type de pointeur réel de chaque événement. */
  if (reduced) return;
  var isMouse = function (e) { return e.pointerType !== 'touch'; };

  /* --- Spotlight + inclinaison des cartes --- */
  document.querySelectorAll('.hub-card, .project-card').forEach(function (card) {
    var rect = null, raf = 0, tilt = card.classList.contains('hub-card') ? 4.5 : 3;
    card.addEventListener('pointerenter', function (e) {
      if (!isMouse(e)) return;
      rect = card.getBoundingClientRect();
      card.classList.add('lit');
    });
    card.addEventListener('pointermove', function (e) {
      if (raf || !isMouse(e)) return;
      raf = requestAnimationFrame(function () {
        raf = 0;
        if (!rect) rect = card.getBoundingClientRect();
        var x = e.clientX - rect.left, y = e.clientY - rect.top;
        card.style.setProperty('--mx', x + 'px');
        card.style.setProperty('--my', y + 'px');
        card.style.setProperty('--rx', ((y / rect.height) - 0.5) * -tilt + 'deg');
        card.style.setProperty('--ry', ((x / rect.width) - 0.5) * tilt + 'deg');
      });
    });
    card.addEventListener('pointerleave', function () {
      card.classList.remove('lit');
      rect = null;
      card.style.setProperty('--rx', '0deg');
      card.style.setProperty('--ry', '0deg');
    });
  });

  /* --- Parallaxe du héros --- */
  var hero = document.querySelector('.hero');
  if (hero) {
    var hraf = 0;
    hero.addEventListener('pointermove', function (e) {
      if (hraf || !isMouse(e)) return;
      hraf = requestAnimationFrame(function () {
        hraf = 0;
        hero.style.setProperty('--px', (e.clientX / window.innerWidth - 0.5).toFixed(3));
        hero.style.setProperty('--py', (e.clientY / window.innerHeight - 0.5).toFixed(3));
      });
    });
    hero.addEventListener('pointerleave', function () {
      hero.style.setProperty('--px', 0);
      hero.style.setProperty('--py', 0);
    });
  }
})();
</script>
</body>
</html>
