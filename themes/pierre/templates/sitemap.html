<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url><loc>{{ SITE_ABSOLUTE_URL }}/</loc></url>
{% for p in pages if p.slug != '404' %}
  <url><loc>{{ SITE_ABSOLUTE_URL }}/{{ p.url }}</loc>{% if p.modified %}<lastmod>{{ p.modified.strftime('%Y-%m-%d') }}</lastmod>{% endif %}</url>
{% endfor %}
</urlset>
